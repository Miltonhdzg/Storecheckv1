<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Store Check</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      /* Theme light variables */
      --bg: #f8fafc;
      --card: #ffffff;
      --card-header: #ffffff;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --secondary: #6366f1;
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --input-bg: #ffffff;
      --input-hover: #f8fafc;
      --table-odd: #f8fafc;
      --table-hover: #f1f5f9;
      --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);
      --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05);
      --row-highlight: rgba(79, 70, 229, 0.04);
      --row-filled: rgba(16, 185, 129, 0.05);
      --row-filled-border: rgba(16, 185, 129, 0.2);
      --progress-bg: #e2e8f0;
      --progress-fill: #4f46e5;
    }

    [data-theme="dark"] {
      /* Theme dark variables */
      --bg: #090d16;
      --card: #111827;
      --card-header: #111827;
      --primary: #6366f1;
      --primary-hover: #818cf8;
      --secondary: #4f46e5;
      --success: #34d399;
      --warning: #fbbf24;
      --error: #f87171;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #1f2937;
      --input-bg: #0f172a;
      --input-hover: #1e293b;
      --table-odd: #111827;
      --table-hover: rgba(99, 102, 241, 0.15);
      --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.3);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.4), 0 2px 4px -2px rgba(0,0,0,0.4);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.4), 0 4px 6px -4px rgba(0,0,0,0.4);
      --shadow-xl: 0 25px 50px -12px rgba(0,0,0,0.5);
      --row-highlight: rgba(99, 102, 241, 0.08);
      --row-filled: rgba(52, 211, 153, 0.08);
      --row-filled-border: rgba(52, 211, 153, 0.35);
      --progress-bg: #1f2937;
      --progress-fill: #6366f1;
    }

    * {
      box-sizing: border-box;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    html, body {
      min-height: 100%;
    }

    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    .container {
      max-width: 1080px;
      margin: 20px auto;
      padding: 0 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-xl);
      overflow: hidden;
      min-height: calc(100vh - 40px);
      display: flex;
      flex-direction: column;
    }

    /* Modern header */
    .app-header {
      padding: 24px 28px;
      background: var(--card-header);
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    
    .app-header::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon-logo {
      width: 32px;
      height: 32px;
      color: var(--primary);
      flex-shrink: 0;
    }

    .app-header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--text) 50%, var(--muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .app-header p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }

    /* Theme Toggle */
    .btn-theme-toggle {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all 0.2s ease;
    }

    .btn-theme-toggle:hover {
      background: var(--input-hover);
      border-color: var(--primary);
      transform: scale(1.05);
    }

    .sun-icon { display: none; width: 20px; height: 20px; }
    .moon-icon { display: block; width: 20px; height: 20px; }

    [data-theme="dark"] .sun-icon { display: block; }
    [data-theme="dark"] .moon-icon { display: none; }

    form {
      padding: 24px 28px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 16px;
    }
    .col-4 { grid-column: span 4 }
    .col-6 { grid-column: span 6 }
    .col-12 { grid-column: span 12 }

    label {
      display: block;
      margin: 0 0 6px;
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.1px;
    }

    select,
    input[type=text],
    textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--input-bg);
      color: var(--text);
      outline: none;
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }

    select:hover,
    input[type=text]:hover,
    textarea:hover {
      border-color: var(--secondary);
      background-color: var(--input-hover);
    }

    select:focus,
    input[type=text]:focus,
    textarea:focus {
      border-color: var(--primary);
      background-color: var(--card);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
    }

    input::placeholder { color: var(--muted); opacity: 0.8; }

    /* Productos section styling */
    .productos-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
      min-height: 0;
    }

    .productos-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .badge-progreso {
      font-size: 11px;
      font-weight: 800;
      background: var(--primary);
      color: #ffffff;
      padding: 3px 8px;
      border-radius: 999px;
      letter-spacing: 0.2px;
      box-shadow: var(--shadow-sm);
    }

    /* Progress Bar */
    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: var(--progress-bg);
      border-radius: 999px;
      overflow: hidden;
      margin-top: -4px;
    }

    .barra-progreso-captura {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--success));
      border-radius: inherit;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Draft badge */
    .draft-badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--success);
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.08);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(16, 185, 129, 0.15);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      display: inline-block;
    }
    
    .dot.pulse {
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {
      0% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.6; }
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      margin: 0;
      font-weight: 500;
    }

    /* Table styles */
    .tabla-wrapper {
      margin-top: 4px;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: auto;
      flex: 1;
      min-height: 250px;
      background: var(--card);
      box-shadow: var(--shadow-sm);
      position: relative;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--card);
      border-bottom: 2px solid var(--border);
      box-shadow: 0 1px 0 var(--border);
    }

    th, td {
      border-bottom: 1px solid var(--border);
      padding: 12px 14px;
      text-align: left;
      vertical-align: middle;
    }

    th {
      color: var(--muted);
      font-weight: 800;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    tbody tr:nth-child(even) { background: var(--card); }
    tbody tr:nth-child(odd) { background: var(--table-odd); }
    
    tbody tr {
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    tbody tr:hover {
      background: var(--table-hover) !important;
    }

    /* Highlighting captured item rows */
    tbody tr.row-filled {
      background: var(--row-filled) !important;
    }

    tbody tr.row-filled td {
      border-bottom-color: var(--row-filled-border);
    }

    tbody tr.row-filled .precio {
      border-color: var(--success);
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.08);
      font-weight: 700;
    }

    #tablaProductos th:nth-child(1),
    #tablaProductos td:nth-child(1) { width: 50% }

    #tablaProductos th:nth-child(2),
    #tablaProductos td:nth-child(2) { width: 28% }

    #tablaProductos th:nth-child(3),
    #tablaProductos td:nth-child(3) { width: 22% }

    #tablaProductos .producto {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.35;
      max-height: 2.7em;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      text-overflow: ellipsis;
      white-space: normal;
      word-break: break-word;
    }

    .promo {
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 8px;
    }

    .precio {
      padding: 6px 10px;
      font-size: 14px;
      text-align: right;
      font-weight: 500;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font: inherit;
      font-size: 14px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn:hover {
      border-color: var(--secondary);
      color: var(--primary);
      background: var(--input-hover);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }
    
    .btn:active {
      transform: translateY(0);
      box-shadow: var(--shadow-sm);
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
    }

    .btn-primary {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
    }
    .btn-primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
      color: #FFFFFF;
    }

    .footer {
      padding: 20px 28px;
      display: flex;
      gap: 16px;
      border-top: 1px solid var(--border);
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      background: var(--card);
    }

    .footer > div:first-child {
      min-width: 0;
      flex: 1;
    }

    .errors,
    .success {
      display: none;
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      animation: slide-up 0.25s ease;
    }

    @keyframes slide-up {
      from { transform: translateY(4px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .errors {
      color: var(--error);
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.15);
    }
    .success {
      color: var(--success);
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.15);
    }

    body.modal-open { overflow: hidden; }

    /* Modern modal styling */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      transition: opacity 0.25s ease;
    }
    .modal-backdrop[hidden] { display: none; }

    .modal {
      width: min(440px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-xl);
      padding: 24px;
      animation: modal-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes modal-in {
      from { transform: scale(0.9) translateY(10px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    .modal-header {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .modal-status-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      background: rgba(79, 70, 229, 0.1);
    }
    
    .modal-status-icon::before {
      content: "";
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--primary);
      animation: pulse 1.2s ease-in-out infinite;
    }

    .modal h2 {
      margin: 0 0 6px;
      color: var(--text);
      font-size: 18px;
      font-weight: 800;
      line-height: 1.2;
    }

    .modal p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--progress-bg);
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: var(--primary);
      transition: width 0.3s ease;
    }

    .modal-progress-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .modal.is-success .modal-status-icon {
      background: rgba(16, 185, 129, 0.1);
    }
    .modal.is-success .modal-status-icon::before,
    .modal.is-success .progress-fill {
      background: var(--success);
      animation: none;
    }
    
    /* Custom SVG Checkmark for Success in modal */
    .modal.is-success .modal-status-icon::before {
      content: "✓";
      color: var(--success);
      background: none;
      font-size: 20px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal.is-error .modal-status-icon {
      background: rgba(239, 68, 68, 0.1);
    }
    .modal.is-error .modal-status-icon::before,
    .modal.is-error .progress-fill {
      background: var(--error);
      animation: none;
    }
    
    /* Custom mark for Error in modal */
    .modal.is-error .modal-status-icon::before {
      content: "✕";
      color: var(--error);
      background: none;
      font-size: 18px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.85); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    /* Scrollbars customizing */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
    }

    /* Responsivo */
    @media (max-width: 820px) {
      .container {
        max-width: 100%;
        margin: 0;
        padding: 0;
      }
      .card {
        min-height: 100vh;
        border-radius: 0;
        border-left: 0;
        border-right: 0;
        box-shadow: none;
      }

      .app-header {
        padding: 16px 16px 14px;
      }
      .app-header h1 { font-size: 20px; }
      
      form {
        padding: 16px;
        gap: 16px;
      }

      .grid { gap: 12px; }
      .col-4,
      .col-6 { grid-column: span 12; }

      select,
      input[type=text],
      textarea {
        padding: 9px 12px;
        font-size: 14px;
      }

      th, td {
        padding: 10px 8px;
        font-size: 13px;
      }

      #tablaProductos th:nth-child(1),
      #tablaProductos td:nth-child(1) { width: 45% }

      #tablaProductos th:nth-child(2),
      #tablaProductos td:nth-child(2) { width: 30% }

      #tablaProductos th:nth-child(3),
      #tablaProductos td:nth-child(3) { width: 25% }

      #tablaProductos .producto {
        font-size: 13px;
      }

      .footer {
        flex-direction: column;
        align-items: stretch;
        padding: 16px;
        gap: 14px;
      }

      .footer > div:first-child {
        width: 100%;
      }

      .footer style-buttons {
        display: flex;
        width: 100%;
      }

      .footer .btn {
        flex: 1;
        min-height: 42px;
        font-size: 14px;
      }

      .modal-backdrop { padding: 14px; }
      .modal { padding: 20px; }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">

      <header class="app-header">
        <div class="header-content">
          <div class="logo-area">
            <!-- Inline SVG Logo -->
            <svg class="icon-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <div>
              <h1>Store Check</h1>
              <p>Elige Cadena y Estado. Coloca el precio OFERTA.</p>
            </div>
          </div>
          <!-- Dark Mode Toggle Button -->
          <button type="button" id="btnThemeToggle" class="btn-theme-toggle" aria-label="Cambiar tema">
            <!-- Sun Icon (shown in dark mode) -->
            <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <!-- Moon Icon (shown in light mode) -->
            <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
      </header>

      <form id="formPrecios" autocomplete="off">

        <!-- === SELECTORES === -->
        <section class="grid">
          <div class="col-4">
            <label for="cadena">Cadena</label>
            <select id="cadena" name="cadena" required>
              <option value="" selected disabled>Selecciona...</option>
            </select>
          </div>

          <div class="col-4">
            <label for="familia">Familia</label>
            <select id="familia" name="familia">
              <option value="" selected>Todas</option>
            </select>
          </div>

          <div class="col-4">
            <label for="estado">Estado</label>
            <select id="estado" name="estado" required>
              <option value="" selected disabled>Selecciona...</option>
            </select>
          </div>
        </section>

  <!-- === TEMPLATE DE FILA === -->
  <template id="tplFila">
    <tr>
      <td><div class="producto" aria-hidden="false"></div></td>
      <td>
        <select class="promo">
          <option value="Sin Oferta" selected>Sin Oferta</option>
          <option value="2x1">2x1</option>
          <option value="3x2">3x2</option>
          <option value="5x3">5x3</option>          
        </select>

      <td><input type="text" class="precio" placeholder="0.00" inputmode="decimal" /></td>

  </template>

  <!-- === JS === -->
  <script>
    const ESTADOS_MX = [
      "Aguascalientes","Baja California","Baja California Sur","Campeche","Chiapas","Chihuahua","Ciudad de México","Coahuila","Colima","Durango","Estado de México","Guanajuato","Guerrero","Hidalgo","Jalisco","Michoacán","Morelos","Nayarit","Nuevo León","Oaxaca","Puebla","Querétaro","Quintana Roo","San Luis Potosí","Sinaloa","Sonora","Tabasco","Tamaulipas","Tlaxcala","Veracruz","Yucatán","Zacatecas"
    ];

    const CATALOGO_URL = 'https://script.google.com/macros/s/AKfycbz0nlveTzDA5sAn9O6ToIit-T_maUhwAyoyhN-XsKeTKC5gLFFVeIghs00aGHMqcbyXKA/exec?action=catalogo';
    let PRODUCTOS_POR_CADENA = {};
    const PROMOCIONES = ['Oferta', '2x1', '3x2', '5x3'];
    const LEGACY_CHAR_MAP = {
      0x87: 'á',
      0x8E: 'é',
      0x97: 'ó',
      0x9C: 'ú'
    };

    function limpiarTexto(valor){
      return (valor ?? '')
        .toString()
        .replace(/\s+/g, ' ')
        .trim();
    }

    function capitalizarEtiqueta(valor){
      return limpiarTexto(valor)
        .toLocaleLowerCase('es-MX')
        .split(' ')
        .map(palabra => palabra
          ? palabra.charAt(0).toLocaleUpperCase('es-MX') + palabra.slice(1)
          : ''
        )
        .join(' ');
    }

    function claveCanonica(valor){
      return limpiarTexto(valor)
        .toLocaleLowerCase('es-MX')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '');
    }

    function preferirEtiqueta(actual, siguiente){
      if(!actual) return siguiente;
      const actualAscii = /^[\x00-\x7F]*$/.test(actual);
      const siguienteAscii = /^[\x00-\x7F]*$/.test(siguiente);
      if(actualAscii && !siguienteAscii) return siguiente;
      return actual;
    }

    function normalizarDatos(){
      Object.keys(PRODUCTOS_POR_CADENA).forEach(cadena=>{
        const familiasCanonicas = new Map();
        PRODUCTOS_POR_CADENA[cadena] = (PRODUCTOS_POR_CADENA[cadena]||[]).map(item=>{
          const segmentoOriginal = item.Segmento ?? item.segmento ?? item.Familia ?? item.familia ?? '';
          const segmentoLimpio = limpiarTexto(segmentoOriginal);
          const segmentoClave = claveCanonica(segmentoLimpio);
          const segmentoPropuesto = segmentoLimpio ? capitalizarEtiqueta(segmentoLimpio) : '';
          const segmento = segmentoLimpio
            ? preferirEtiqueta(familiasCanonicas.get(segmentoClave), segmentoPropuesto)
            : '';

          if(segmentoClave && !familiasCanonicas.has(segmentoClave)){
            familiasCanonicas.set(segmentoClave, segmento);
          }else if(segmentoClave){
            familiasCanonicas.set(segmentoClave, segmento);
          }

          return {
            producto: limpiarTexto(item.Producto ?? item.producto ?? ''),
            marca: limpiarTexto(item.Marca ?? item.marca ?? ''),
            segmento,
            codigo: limpiarTexto(item['Codigo Producto'] ?? item.codigo ?? item.Codigo ?? '')
          };
        });
      });
    }

    /* === FUNCIONES === */
    function normalizarPrecio(valor){
      if(!valor) return '';
      let v = (valor+'').trim().replace(',', '.').replace(/[^0-9.]/g,'');
      const i = v.indexOf('.');
      if(i!==-1) v = v.slice(0,i+1) + v.slice(i+1).replace(/\./g,'');
      const m = v.match(/^(\d+)(?:\.(\d{0,2}))?$/);
      if(!m){
        const p = v.split('.');
        if(p.length===1) return p[0];
        return p[0]+'.'+p[1].slice(0,2);
      }
      return m[1] + (m[2]!==undefined ? '.'+m[2] : '');
    }

    function formateaDinero(num){
      const n = Number(num);
      if(!isFinite(n)) return '';
      return n.toFixed(2);
    }

    function decodificarTextoMixto(buffer){
      const utf8 = new TextDecoder('utf-8').decode(buffer);
      if(!utf8.includes('\uFFFD')) return utf8;

      const bytes = new Uint8Array(buffer);
      let out = '';

      for(let i=0;i<bytes.length;i++){
        const b0 = bytes[i];

        if(b0 < 0x80){
          out += String.fromCharCode(b0);
          continue;
        }

        const b1 = bytes[i+1];
        const b2 = bytes[i+2];
        const b3 = bytes[i+3];

        const es2 =
          b0 >= 0xC2 && b0 <= 0xDF &&
          b1 >= 0x80 && b1 <= 0xBF;

        const es3 =
          (
            (b0 === 0xE0 && b1 >= 0xA0 && b1 <= 0xBF) ||
            (b0 >= 0xE1 && b0 <= 0xEC && b1 >= 0x80 && b1 <= 0xBF) ||
            (b0 === 0xED && b1 >= 0x80 && b1 <= 0x9F) ||
            (b0 >= 0xEE && b0 <= 0xEF && b1 >= 0x80 && b1 <= 0xBF)
          ) &&
          b2 >= 0x80 && b2 <= 0xBF;

        const es4 =
          (
            (b0 === 0xF0 && b1 >= 0x90 && b1 <= 0xBF) ||
            (b0 >= 0xF1 && b0 <= 0xF3 && b1 >= 0x80 && b1 <= 0xBF) ||
            (b0 === 0xF4 && b1 >= 0x80 && b1 <= 0x8F)
          ) &&
          b2 >= 0x80 && b2 <= 0xBF &&
          b3 >= 0x80 && b3 <= 0xBF;

        if(es2){
          out += new TextDecoder('utf-8').decode(bytes.slice(i, i+2));
          i += 1;
          continue;
        }

        if(es3){
          out += new TextDecoder('utf-8').decode(bytes.slice(i, i+3));
          i += 2;
          continue;
        }

        if(es4){
          out += new TextDecoder('utf-8').decode(bytes.slice(i, i+4));
          i += 3;
          continue;
        }

        if(LEGACY_CHAR_MAP[b0]){
          out += LEGACY_CHAR_MAP[b0];
          continue;
        }

        if(b0 >= 0xA0){
          out += String.fromCharCode(b0);
          continue;
        }

        out += '\uFFFD';
      }

      return out;
    }

    const tablaBody = document.querySelector('#tablaProductos tbody');
    const tpl = document.getElementById('tplFila');
    const selCadena = document.getElementById('cadena');
    const selFamilia = document.getElementById('familia');
    const selEstado = document.getElementById('estado');
    const btnLimpiar = document.getElementById('btnLimpiar');
    const btnEnviar = document.getElementById('btnEnviar');
    const errorsEl = document.getElementById('errors');
    const okEl = document.getElementById('success');
    const modalEnvio = document.getElementById('modalEnvio');
    const modalEnvioCard = document.getElementById('modalEnvioCard');
    const modalDetalle = document.getElementById('modalEnvioDetalle');
    const modalEtapa = document.getElementById('modalEtapa');
    const modalPorcentaje = document.getElementById('modalPorcentaje');
    const modalProgreso = document.getElementById('modalProgreso');
    const modalBarra = document.getElementById('modalBarra');
    const modalCerrar = document.getElementById('modalCerrar');
    
    // Memory Maps for temporary input storage
    const preciosMem = new Map();
    const promosMem = new Map();

    // Restoring maps from localStorage
    const localPrecios = localStorage.getItem('storecheck_precios');
    if(localPrecios) {
      try {
        const arr = JSON.parse(localPrecios);
        arr.forEach(([k, v]) => preciosMem.set(k, v));
      } catch(e) {}
    }
    const localPromos = localStorage.getItem('storecheck_promos');
    if(localPromos) {
      try {
        const arr = JSON.parse(localPromos);
        arr.forEach(([k, v]) => promosMem.set(k, v));
      } catch(e) {}
    }

    function claveItem(cadena, it){
      const cod = (it.codigo || '').trim();
      if(cod) return `${cadena}::${cod}`;
      return `${cadena}::${it.producto || ''}::${it.marca || ''}`;
    }

    function mostrarMsg(tipo,txt){
      if(tipo==='error'){
        errorsEl.textContent=txt;
        errorsEl.style.display='block';
        okEl.style.display='none';
      } else {
        okEl.textContent=txt;
        okEl.style.display='block';
        errorsEl.style.display='none';
      }
    }

    function esperar(ms){
      return new Promise(resolve=>setTimeout(resolve, ms));
    }

    function setControlesEnvio(desactivado){
      btnLimpiar.disabled = desactivado;
      btnEnviar.disabled = desactivado;
    }

    function actualizarModalEnvio(etapa, detalle, porcentaje){
      const pct = Math.max(0, Math.min(100, Math.round(porcentaje)));
      modalEtapa.textContent = etapa;
      modalDetalle.textContent = detalle;
      modalPorcentaje.textContent = `${pct}%`;
      modalBarra.style.width = `${pct}%`;
      modalProgreso.setAttribute('aria-valuenow', String(pct));
    }

    function abrirModalEnvio(){
      modalEnvioCard.classList.remove('is-success','is-error');
      modalCerrar.hidden = true;
      actualizarModalEnvio('Preparando', 'Validando precios capturados.', 10);
      modalEnvio.hidden = false;
      modalEnvio.setAttribute('aria-hidden','false');
      document.body.classList.add('modal-open');
    }

    function cerrarModalEnvio(){
      modalEnvio.hidden = true;
      modalEnvio.setAttribute('aria-hidden','true');
      document.body.classList.remove('modal-open');
    }

    async function finalizarModalEnvio(tipo, etapa, detalle){
      modalEnvioCard.classList.add(tipo === 'error' ? 'is-error' : 'is-success');
      actualizarModalEnvio(etapa, detalle, 100);
      modalCerrar.hidden = false;
      if(tipo === 'success'){
        await esperar(1200);
        cerrarModalEnvio();
      }
    }

    modalCerrar.addEventListener('click', cerrarModalEnvio);

    function poblarEstados(){
      selEstado.innerHTML = '<option value="" selected disabled>Selecciona...</option>';
      ESTADOS_MX.forEach(e=>{
        const o=document.createElement('option');
        o.value=e; o.textContent=e;
        selEstado.appendChild(o);
      });
    }

    function poblarCadenas(){
      selCadena.innerHTML = '<option value="" selected disabled>Selecciona...</option>';
      Object.keys(PRODUCTOS_POR_CADENA)
        .sort((a,b)=>a.localeCompare(b))
        .forEach(c=>{
          const o=document.createElement('option');
          o.value=c; o.textContent=c;
          selCadena.appendChild(o);
        });
    }

    function poblarFamilias(cadena){
      selFamilia.innerHTML = '<option value="" selected>Todas</option>';
      if(!cadena) return;
      const set = new Set();
      (PRODUCTOS_POR_CADENA[cadena]||[]).forEach(it=>{
        if(it.segmento) set.add(it.segmento);
      });
      [...set].sort((a,b)=>a.localeCompare(b)).forEach(f=>{
        const o=document.createElement('option');
        o.value=f; o.textContent=f;
        selFamilia.appendChild(o);
      });
    }

    function limpiarTabla(){ 
      tablaBody.innerHTML=''; 
      actualizarProgresoCaptura();
    }

    // Capture Progress indicator and dynamic formatting
    function actualizarProgresoCaptura() {
      const filas = [...tablaBody.querySelectorAll('tr')];
      const total = filas.length;
      let capturados = 0;

      filas.forEach(tr => {
        const prInput = tr.querySelector('.precio');
        const hasPrice = prInput && prInput.value.trim().length > 0;
        if(hasPrice) {
          tr.classList.add('row-filled');
          capturados++;
        } else {
          tr.classList.remove('row-filled');
        }
      });

      const badge = document.getElementById('badgeProgreso');
      const bar = document.getElementById('barraProgresoCaptura');
      badge.textContent = `${capturados} / ${total}`;
      
      const pct = total > 0 ? (capturados / total) * 100 : 0;
      bar.style.width = `${pct}%`;

      const draftStatus = document.getElementById('draftStatus');
      if (capturados > 0) {
        draftStatus.innerHTML = '<span class="draft-badge"><span class="dot pulse"></span>Borrador guardado localmente</span>';
      } else {
        draftStatus.innerHTML = '';
      }
    }

    function cargarTabla(cadena, familia){
      limpiarTabla();
      let items = (PRODUCTOS_POR_CADENA[cadena]||[]).slice();
      if(familia) items = items.filter(it=>it.segmento===familia);

      items.forEach(it=>{
        const node=tpl.content.cloneNode(true);
        const trNode = node.querySelector('tr');
        trNode.dataset.codigo=it.codigo||'';
        trNode.dataset.marca=it.marca||'';
        node.querySelector('.producto').textContent=it.producto||'';
        
        let pr=node.querySelector('.precio');
        let promoSel=node.querySelector('.promo');
        const key = claveItem(cadena, it);
        
        if(preciosMem.has(key)) {
          pr.value = preciosMem.get(key);
        }
        
        promoSel.value = promosMem.get(key) || PROMOCIONES[0];
        
        pr.addEventListener('input',e=>{
          const v = normalizarPrecio(e.target.value);
          e.target.value = v;
          if(v) {
            preciosMem.set(key, v);
          } else {
            preciosMem.delete(key);
          }
          localStorage.setItem('storecheck_precios', JSON.stringify([...preciosMem]));
          actualizarProgresoCaptura();
        });

        // Fast keyboard navigation between price inputs
        pr.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === 'ArrowDown') {
            e.preventDefault();
            const inputs = [...tablaBody.querySelectorAll('.precio')];
            const idx = inputs.indexOf(e.target);
            if (idx !== -1 && idx < inputs.length - 1) {
              inputs[idx + 1].focus();
              inputs[idx + 1].select();
            }
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            const inputs = [...tablaBody.querySelectorAll('.precio')];
            const idx = inputs.indexOf(e.target);
            if (idx !== -1 && idx > 0) {
              inputs[idx - 1].focus();
              inputs[idx - 1].select();
            }
          }
        });

        pr.addEventListener('focus', e => {
          e.target.select();
        });
        
        promoSel.addEventListener('change', e=>{
          promosMem.set(key, e.target.value || PROMOCIONES[0]);
          localStorage.setItem('storecheck_promos', JSON.stringify([...promosMem]));
        });
        
        tablaBody.appendChild(node);
      });

      actualizarProgresoCaptura();
    }

    /* === EVENTOS DE SELECTORES === */
    selCadena.addEventListener('change',()=>{
      localStorage.setItem('storecheck_cadena', selCadena.value);
      // Reset familia selector since we populated families for a new chain
      selFamilia.value = '';
      localStorage.setItem('storecheck_familia', '');
      poblarFamilias(selCadena.value);
      cargarTabla(selCadena.value, selFamilia.value);
    });

    selFamilia.addEventListener('change',()=>{
      localStorage.setItem('storecheck_familia', selFamilia.value);
      cargarTabla(selCadena.value, selFamilia.value);
    });

    selEstado.addEventListener('change', () => {
      localStorage.setItem('storecheck_estado', selEstado.value);
    });

    btnLimpiar.addEventListener('click',()=>{
      if (preciosMem.size > 0 || selCadena.value || selEstado.value) {
        if (!confirm('¿Estás seguro de que deseas limpiar todo el formulario y borrar los datos guardados?')) {
          return;
        }
      }
      document.getElementById('formPrecios').reset();
      poblarFamilias('');
      limpiarTabla();
      preciosMem.clear();
      promosMem.clear();
      localStorage.removeItem('storecheck_precios');
      localStorage.removeItem('storecheck_promos');
      localStorage.removeItem('storecheck_cadena');
      localStorage.removeItem('storecheck_estado');
      localStorage.removeItem('storecheck_familia');
      actualizarProgresoCaptura();
      mostrarMsg('success','Formulario y borrador limpiados con éxito.');
    });

    /* === CARGAR PRODUCTOS DESDE SHEET === */
    async function cargarProductosDesdeSheets(){
      try{
        const res = await fetch(CATALOGO_URL, { cache: 'no-store' });
        if(!res.ok) throw new Error('No se pudo leer el catalogo');

        const json = await res.json();
        if(!json.ok) throw new Error(json.error || 'Respuesta invalida del catalogo');

        const rows = Array.isArray(json.rows) ? json.rows : [];
        PRODUCTOS_POR_CADENA = {};

        for (const item of rows) {
          const cadena = limpiarTexto(item['Cadena']);
          const marca = limpiarTexto(item['Marca']);
          const producto = limpiarTexto(item['Producto']);
          const familia = limpiarTexto(item['Familia']);
          const codigo = limpiarTexto(item['Codigo Producto']);

          if (!cadena || !producto) continue;
          if (!PRODUCTOS_POR_CADENA[cadena]) PRODUCTOS_POR_CADENA[cadena] = [];

          PRODUCTOS_POR_CADENA[cadena].push({
            producto,
            marca,
            segmento: familia,
            codigo
          });
        }

        normalizarDatos();
        poblarCadenas();

        // Restore values from localStorage
        const localCadena = localStorage.getItem('storecheck_cadena');
        const localEstado = localStorage.getItem('storecheck_estado');
        const localFamilia = localStorage.getItem('storecheck_familia');

        if(localEstado) {
          selEstado.value = localEstado;
        }

        if(localCadena && PRODUCTOS_POR_CADENA[localCadena]) {
          selCadena.value = localCadena;
          poblarFamilias(localCadena);
          
          if(localFamilia) {
            const options = [...selFamilia.options].map(o => o.value);
            if(options.includes(localFamilia)) {
              selFamilia.value = localFamilia;
            }
          }
          cargarTabla(selCadena.value, selFamilia.value);
        }
      }catch(err){
        console.error('Error al cargar catálogo:', err);
        mostrarMsg('error','No se pudo cargar el catalogo desde Google Sheets. Revisa tu conexión.');
      }
    }

    const ENDPOINT = "https://script.google.com/macros/s/AKfycbz0nlveTzDA5sAn9O6ToIit-T_maUhwAyoyhN-XsKeTKC5gLFFVeIghs00aGHMqcbyXKA/exec";
    const API_TOKEN = "10152021"; // el mismo del Apps Script

    poblarEstados();
    cargarProductosDesdeSheets();

    // === SISTEMA DE TEMAS ===
    const btnThemeToggle = document.getElementById('btnThemeToggle');
    
    function setTema(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('storecheck_theme', theme);
    }

    function inicializarTema() {
      const savedTheme = localStorage.getItem('storecheck_theme');
      if (savedTheme) {
        setTema(savedTheme);
      } else {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        setTema(prefersDark ? 'dark' : 'light');
      }
    }

    btnThemeToggle.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
      setTema(currentTheme === 'dark' ? 'light' : 'dark');
    });

    inicializarTema();

    /* === ENVÍO === */
    document.getElementById('formPrecios').addEventListener('submit', async e=>{
      e.preventDefault();
      const cadena=selCadena.value;
      const estado=selEstado.value;
      if(!cadena||!estado)
        return mostrarMsg('error','Selecciona Cadena y Estado.');

      if(!PRODUCTOS_POR_CADENA[cadena] || PRODUCTOS_POR_CADENA[cadena].length===0)
        return mostrarMsg('error','No hay productos configurados para esta Cadena.');

      const filas=[...tablaBody.querySelectorAll('tr')];
      const items=[];

      for(const tr of filas){
        const producto=limpiarTexto(tr.querySelector('.producto').textContent);
        const marca=tr.dataset.marca||'';
        const promo=tr.querySelector('.promo').value || PROMOCIONES[0];
        const codigo=tr.dataset.codigo||'';
        let pr=normalizarPrecio(tr.querySelector('.precio').value.trim());
        if(!pr) continue;
        pr=formateaDinero(pr);
        items.push({prod:producto,producto,marca,promo,codigo,pr});
      }

      if(items.length===0)
        return mostrarMsg('error','Agrega al menos un precio.');

      const familia = selFamilia.value || '';

      const payload = {
        token: API_TOKEN,
        cadena,
        estado,
        familia,
        items
      };

      setControlesEnvio(true);
      abrirModalEnvio();

      try{
        await esperar(250);
        actualizarModalEnvio('Enviando', 'Mandando información al servidor.', 45);

        const ok = navigator.sendBeacon
          ? navigator.sendBeacon(
              ENDPOINT,
              new Blob([JSON.stringify(payload)], { type: 'text/plain;charset=utf-8' })
            )
          : false;

        if(!ok){
          actualizarModalEnvio('Reintentando', 'La primera ruta no respondió. Intentando envío alterno.', 70);
          await fetch(ENDPOINT, {
            method: 'POST',
            mode: 'no-cors',
            keepalive: true,
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
          });
        }else{
          actualizarModalEnvio('Solicitud enviada', 'El navegador aceptó el envío.', 78);
          await esperar(300);
        }

        actualizarModalEnvio('Finalizando', 'Limpiando formulario.', 92);
        await esperar(250);
        
        document.getElementById('formPrecios').reset();
        poblarFamilias('');
        limpiarTabla();
        preciosMem.clear();
        promosMem.clear();
        
        // Clean draft storage after successful submit
        localStorage.removeItem('storecheck_precios');
        localStorage.removeItem('storecheck_promos');
        localStorage.removeItem('storecheck_cadena');
        localStorage.removeItem('storecheck_estado');
        localStorage.removeItem('storecheck_familia');
        actualizarProgresoCaptura();

        mostrarMsg('success','Enviado con éxito ✅');
        await finalizarModalEnvio('success', 'Enviado', 'Los precios fueron enviados.');
      }catch(err){
        mostrarMsg('error','No se pudo enviar (sin señal o bloqueado). Intenta de nuevo.');
        await finalizarModalEnvio('error', 'Error de envío', 'No se pudo completar el envío. Intenta de nuevo.');
      }finally{
        setControlesEnvio(false);
      }
    });
  </script>

</body>
</html>
